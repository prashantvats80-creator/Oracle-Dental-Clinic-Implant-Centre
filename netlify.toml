# Netlify Configuration for Oracle Dental Clinic & Implant Center

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Permanent 301 Redirects for Consolidated Pages (must precede SPA fallback)
# Group A: Local Dentist / Dental Clinic
[[redirects]]
  from = "/dentist-near-me"
  to = "/dentist-chipiyana-buzurg-ghaziabad"
  status = 301
  force = true

[[redirects]]
  from = "/dentist-ghaziabad"
  to = "/dentist-chipiyana-buzurg-ghaziabad"
  status = 301
  force = true

[[redirects]]
  from = "/dental-clinic-ghaziabad"
  to = "/dentist-chipiyana-buzurg-ghaziabad"
  status = 301
  force = true

# Group B: Gum & Periodontal Treatment
[[redirects]]
  from = "/gum-disease-treatment"
  to = "/periodontal-gum-treatment-ghaziabad"
  status = 301
  force = true

[[redirects]]
  from = "/bleeding-gums"
  to = "/periodontal-gum-treatment-ghaziabad"
  status = 301
  force = true

[[redirects]]
  from = "/swollen-gums"
  to = "/periodontal-gum-treatment-ghaziabad"
  status = 301
  force = true

[[redirects]]
  from = "/gum-recession"
  to = "/periodontal-gum-treatment-ghaziabad"
  status = 301
  force = true

# Group C: Emergency Dentist
[[redirects]]
  from = "/emergency-dentist"
  to = "/emergency-dentist-ghaziabad"
  status = 301
  force = true

# SPA fallback rewrite so direct hits and refreshes on all active routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Global security & non-immutable HTML caching headers
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Ensure Search Console verification file is served directly without caching issues
[[headers]]
  for = "/google685637734a1de471.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/html; charset=utf-8"

# Immutable 1-year caching for Vite content-hashed JS & CSS assets
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 30-day + stale-while-revalidate caching for self-hosted WebP/AVIF/JPEG images
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
