    <!-- Official Botpress AI Dental Assistant Webchat (Single Load & Single Initialization) -->
    <script
      id="oracle-botpress-webchat-script"
      src="https://vdk-viber-runtime-prod.bot.botpress.host/edge/webchat.js"

    ></script>
    <script>
      (function () {
        var BOTPRESS_BASE_URL = 'https://vdk-viber-runtime-prod.bot.botpress.host';
        var BOTPRESS_BOT_ID = '50dd1c17-0fec-434b-b1ef-9ff0c3757ce1';
        var BOTPRESS_CONFIG_URL = BOTPRESS_BASE_URL + '/edge/bots/' + BOTPRESS_BOT_ID + '/config';
        var scriptEl = document.getElementById('oracle-botpress-webchat-script');
        var scriptFailed = false;

        if (scriptEl) {
          scriptEl.addEventListener(
            'error',
            function () {
              scriptFailed = true;
            },
            { once: true }
          );
        }

        window.__initOracleBotpress = function () {
          if (window.__oracleBotpressInstance) {
            return Promise.resolve(window.__oracleBotpressInstance);
          }
          if (window.__oracleBotpressPromise) {
            return window.__oracleBotpressPromise;
          }
          if (scriptFailed) {
            return Promise.reject(new Error('Botpress webchat script failed to load'));
          }

          window.__oracleBotpressPromise = new Promise(function (resolve, reject) {
            function mountOnce() {
              if (!window.VdkEdgeWebchat || typeof window.VdkEdgeWebchat.mount !== 'function') {
                window.__oracleBotpressPromise = null;
                reject(new Error('VdkEdgeWebchat not available'));
                return;
              }

              fetch(BOTPRESS_CONFIG_URL)
                .then(function (res) {
                  if (!res.ok) throw new Error('Botpress config fetch failed: ' + res.status);
                  return res.json();
                })
                .then(function (data) {
                  var webchat = data && data.webchat ? data.webchat : {};
                  return window.VdkEdgeWebchat.mount(
                    Object.assign({}, webchat, {
                      mode: 'bubble',
                      baseUrl: BOTPRESS_BASE_URL,
                      botId: BOTPRESS_BOT_ID,
                    })
                  );
                })
                .then(function (instance) {
                  window.__oracleBotpressInstance = instance;
                  resolve(instance);
                })
                .catch(function (err) {
                  window.__oracleBotpressPromise = null;
                  reject(err);
                });
            }

            if (window.VdkEdgeWebchat && typeof window.VdkEdgeWebchat.mount === 'function') {
              mountOnce();
            } else if (scriptEl) {
              scriptEl.addEventListener('load', mountOnce, { once: true });
              scriptEl.addEventListener(
                'error',
                function () {
                  window.__oracleBotpressPromise = null;
                  reject(new Error('Failed to load Botpress webchat script'));
                },
                { once: true }
              );
            } else {
              window.__oracleBotpressPromise = null;
              reject(new Error('Botpress script element missing'));
            }
          });

          return window.__oracleBotpressPromise;
        };

        function scheduleBotpressInit() {
          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(
              function () {
                window.__initOracleBotpress().catch(function () {});
              },
              { timeout: 2500 }
            );
          } else {
            window.setTimeout(function () {
              window.__initOracleBotpress().catch(function () {});
            }, 1500);
          }
        }

        if (document.readyState === 'complete') {
          scheduleBotpressInit();
        } else {
          window.addEventListener('load', scheduleBotpressInit, { once: true });
        }
      })();
    </script>
